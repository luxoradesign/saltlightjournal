backend:
  name: github
  repo: luxoradesign/saltlightjournal
  branch: main
  # Add your Decap/Static CMS OAuth gateway here when you connect GitHub auth for the live site.
  # Example:
  # base_url: https://your-auth-service.example.com

local_backend: true
publish_mode: editorial_workflow
site_url: https://saltlightjournal.org
display_url: https://saltlightjournal.org
logo_url: /assets/img/saltlight-logo.png
media_folder: assets/img/posts
public_folder: /assets/img/posts

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: posts/{{slug}}
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - {
          label: Publish Date,
          name: date,
          widget: datetime,
          format: "YYYY-MM-DD",
          time_format: false,
        }
      - label: Categories
        name: categories
        widget: select
        multiple: true
        options:
          - Healing
          - Relationships
          - Becoming
          - Identity
          - Boundaries
          - Self-Worth
      - label: Tags
        name: tags
        widget: list
        required: false
      - label: Feature Image
        name: image
        widget: object
        required: false
        fields:
          - { label: Image, name: path, widget: image, required: false }
          - { label: Alt Text, name: alt, widget: string, required: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - {
          label: Featured Quote,
          name: featured_quote,
          widget: text,
          required: false,
        }
      - { label: Body, name: body, widget: markdown }
