<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saltlight Journal Writer</title>
    <style>
      body {
        margin: 0;
        background: linear-gradient(180deg, #f2e7db 0%, #fbf7f2 100%);
        color: #241b18;
        font-family: 'Segoe UI', sans-serif;
      }

      .slj-admin-shell {
        min-height: 100vh;
      }

      .slj-admin-banner {
        padding: 1rem 1.5rem;
        background: #241b18;
        color: #fffaf4;
        font-size: 0.95rem;
      }

      .slj-admin-banner a {
        color: #f2d6c8;
      }
    </style>
  </head>
  <body>
    <div class="slj-admin-shell">
      <div class="slj-admin-banner">
        Writer view for Saltlight Journal. If GitHub login is not connected yet, finish the one-time CMS auth setup
        first, then come back here to publish from your browser.
      </div>
      <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
    </div>
  </body>
</html>
