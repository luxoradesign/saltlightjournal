---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>

    {% if page.subtitle %}
      <p class="post-subtitle">{{ page.subtitle }}</p>
    {% endif %}

    {% if page.excerpt %}
      <p class="post-excerpt">{{ page.excerpt }}</p>
    {% endif %}

    {% if page.featured_quote %}
      <blockquote class="featured-quote">
        {{ page.featured_quote }}
      </blockquote>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
