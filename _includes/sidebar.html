<div id="sidebar" class="d-flex flex-column">
  <div class="profile-wrapper text-center">
    {% if site.logo %}
      <div class="site-logo" style="margin: 1.5rem 0 1.15rem;">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}">
        </a>
      </div>
    {% endif %}

    <p
      class="site-subtitle"
      style="margin: 0 1.4rem 1.5rem; opacity: 0.9; line-height: 1.7;"
    >
      Essays on healing, truth, relationships, and becoming. Written slowly, honestly, and without sanding off the hard
      edges.
    </p>
  </div>

  <nav class="nav flex-column" style="margin-top: 0.5rem;">
    <a class="nav-link" href="{{ '/' | relative_url }}">Home</a>
    <a class="nav-link" href="{{ '/start-here/' | relative_url }}">Start Here</a>
    <a class="nav-link" href="{{ '/categories/' | relative_url }}">Categories</a>
    <a class="nav-link" href="{{ '/archives/' | relative_url }}">Archive</a>
    <a class="nav-link" href="{{ '/about/' | relative_url }}">About</a>
    <a class="nav-link" href="{{ '/admin/' | relative_url }}">Write</a>
  </nav>
</div>
